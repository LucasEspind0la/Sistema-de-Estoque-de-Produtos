services:
  postgres:
    image: postgres:16
    container_name: estoque-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - estoque-data:/var/lib/postgresql/data

volumes:
  estoque-data: